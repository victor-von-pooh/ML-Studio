name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 文書とファイルの決まり (触れてよいリポジトリ, 手元のパス, TODO.md の形) と,
  # 殻の木の中の共通のライブラリの版 (docs/DESIGN.md の表)
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/check_docs.py
      - run: python scripts/check_versions.py

  # 殻のバックエンド (ML-Pathfinder, ML-Fathom, ML-CreateArchitecture,
  # ML-Dashboard, ML-Provide と, それらが submodule で持つ ML-EDA, ML-Quest,
  # ML-ModelControl, ML-Found, ML-Inference を submodule から入れる)
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.10"
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      # そろえた版のライブラリで各アプリの API が動くかを, 殻の環境のまま各アプリのテストで確かめる
      - run: uv run --project ../../backend --frozen pytest -q
        working-directory: ML-Pathfinder/backend
      - run: uv run --project ../../backend --frozen pytest -q
        working-directory: ML-Fathom/backend
      - run: uv run --project ../../backend --frozen pytest -q
        working-directory: ML-CreateArchitecture/backend
      - run: uv run --project ../../backend --frozen pytest -q
        working-directory: ML-Dashboard/backend
      - run: uv run --project ../../backend --frozen pytest -q
        working-directory: ML-Provide/backend

  # 殻の画面 (pnpm workspace に ML-Pathfinder, ML-Fathom, ML-CreateArchitecture,
  # ML-Dashboard, ML-Provide の画面のパッケージを加える)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # 殻を起動し, ブラウザで問題の設定を作ってプロジェクトの欄で選んで開き,
  # データの分析, モデルの作成・選定, 学習・評価, 推論の段階に移る. 殻の帯のキー (R9) と
  # 段階を移ったときの下書き (R10) も確かめる
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.10"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked --python 3.13
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      # Playwright のブラウザは版ごとにキャッシュし, 当たった場合は OS の依存だけを入れる
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: frontend
      - run: pnpm e2e --project=studio
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report

  # 小さな見本で 5 つの段階を画面で通す (学習を含むので別のジョブにする)
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.10"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: uv sync --locked --python 3.13
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      # Playwright のブラウザは版ごとにキャッシュし, 当たった場合は OS の依存だけを入れる
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: frontend
      - run: pnpm e2e --project=journey
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-journey
          path: frontend/playwright-report
