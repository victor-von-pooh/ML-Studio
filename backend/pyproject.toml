[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-studio"
version = "0.1.0"
description = "機械学習の 5 つの段階のアプリを 1 つにまとめるローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # データの分析の段階 (submodule の ML-Fathom)
    "ml-fathom",
    # 問題の設定の段階 (submodule の ML-Pathfinder)
    "ml-pathfinder",
    "uvicorn>=0.32"
]

[project.scripts]
ml-studio = "ml_studio.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8"
]

# 段階のアプリが使うライブラリは 1 つの環境に 1 つの版しか入らないので,
# 段階のアプリごとの求め方 (submodule の版, git の版) を上書きし, ML-Fathom
# の submodule の ML-EDA と ML-Quest を指す (どのアプリの submodule も
# docs/DESIGN.md の「共通のライブラリの版」の版).
# 上書きは extra ごと置き換えるので, 段階のアプリが使う extra を全て書く
# (ML-EDA の all は自分を指す extra で上書きでは効かないため, 中身を並べる)
[tool.uv]
override-dependencies = [
    "ml-eda[parquet,excel,image,text,audio]",
    "ml-quest[data]"
]

# 段階のアプリと, それが使うライブラリ (submodule の中の submodule)
[tool.uv.sources]
ml-eda = { path = "../ML-Fathom/ML-EDA", editable = true }
ml-fathom = { path = "../ML-Fathom/backend", editable = true }
ml-pathfinder = { path = "../ML-Pathfinder/backend", editable = true }
ml-quest = { path = "../ML-Fathom/ML-Quest", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ml_studio"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
