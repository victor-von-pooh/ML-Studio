[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-studio"
version = "0.1.0"
description = "機械学習の 5 つの段階のアプリを 1 つにまとめるローカルの Web アプリ"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    # 問題の設定の段階 (submodule の ML-Pathfinder)
    "ml-pathfinder",
    "uvicorn>=0.32"
]

[project.scripts]
ml-studio = "ml_studio.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8"
]

[tool.uv.sources]
ml-pathfinder = { path = "../ML-Pathfinder/backend", editable = true }
ml-quest = { path = "../ML-Pathfinder/ML-Quest", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ml_studio"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]

[tool.mypy]
strict = true
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
